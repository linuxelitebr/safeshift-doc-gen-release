---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeshift-doc-gen
  namespace: safeshift-doc-gen
  labels:
    app.kubernetes.io/name: safeshift-doc-gen
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    # Web generation holds a thread-lock; avoid two pods racing on it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: safeshift-doc-gen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safeshift-doc-gen
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: safeshift-doc-gen
      # terminationGracePeriodSeconds >= expected generation time, so an
      # in-flight `oc`-heavy batch isn't cut short. Tune to taste.
      terminationGracePeriodSeconds: 120
      containers:
        - name: app
          image: ghcr.io/elastocera/safeshift-doc-gen:latest
          imagePullPolicy: IfNotPresent
          args: ["--web"]
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # Flask debug mode must be off in production
            - name: SSDG_DEBUG
              value: "false"
            # Bearer token for /api/* routes. Without it the app refuses to
            # bind 0.0.0.0 and listens only on 127.0.0.1, which makes the pod
            # unreachable from the Service. Provide it via a Secret you
            # create out-of-band; see deploy/openshift/README.md.
            - name: SSDG_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: safeshift-doc-gen-auth
                  key: token
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: output
              mountPath: /app/output
            - name: cache
              mountPath: /app/cache
            - name: kube
              mountPath: /home/docgen/.kube
            - name: tmp
              mountPath: /tmp
      # All scratch volumes are emptyDir so the pod has zero persistent state.
      # gen_state lives in-process anyway; pod restart loses the in-flight job
      # state and a PVC of `output/` would only catch orphan files we cannot
      # surface back to the user. Consistent with the laptop / binary modes.
      volumes:
        - name: output
          emptyDir:
            sizeLimit: 1Gi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: kube
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
